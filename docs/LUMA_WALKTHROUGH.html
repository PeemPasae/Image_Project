<title>LUMA ทีละบรรทัด</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: diagram across the top, then "what happens" (plain words) beside "the code" (key lines + translation); controls pinned to the bottom */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#151c28; --dim:#5c677a; --line:#d5dbe4;
  --accent:#0f766e; --accent-soft:#d7efec; --on-accent:#ffffff;
  --packet:#c2410c; --packet-soft:#fde3d3;
  --code-bg:#f6f8fa; --hl:#fff1cc; --hl-bar:#d97706;
  --tk-kw:#7c3aed; --tk-str:#0f7b3f; --tk-com:#8a94a6; --tk-num:#b45309;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --panel:#161d27; --ink:#e3e8ef; --dim:#95a1b3; --line:#283242;
  --accent:#2dd4bf; --accent-soft:#123b38; --on-accent:#06201d;
  --packet:#fb923c; --packet-soft:#40210f;
  --code-bg:#111821; --hl:#3a2f12; --hl-bar:#f59e0b;
  --tk-kw:#c4b5fd; --tk-str:#86efac; --tk-com:#6b7a90; --tk-num:#fbbf24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --panel:#161d27; --ink:#e3e8ef; --dim:#95a1b3; --line:#283242;
  --accent:#2dd4bf; --accent-soft:#123b38; --on-accent:#06201d;
  --packet:#fb923c; --packet-soft:#40210f;
  --code-bg:#111821; --hl:#3a2f12; --hl-bar:#f59e0b;
  --tk-kw:#c4b5fd; --tk-str:#86efac; --tk-com:#6b7a90; --tk-num:#fbbf24; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;margin:0;padding-bottom:84px}
.shell{max-width:1240px;margin:0 auto;padding-inline:16px}
header.top{padding-block:18px 8px;display:flex;flex-wrap:wrap;gap:4px 24px;align-items:baseline;justify-content:space-between}
h1{font-family:var(--f-display);font-size:clamp(22px,3vw,28px);margin:0;line-height:1.3}
.hint{color:var(--dim);font-size:13px}
.hint kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel)}
nav.lessons{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
nav.lessons .shell{display:flex;gap:4px;overflow-x:auto;padding-block:8px}
nav.lessons button{flex:0 0 auto;font:600 14.5px var(--f-display);color:var(--dim);background:none;border:0;border-radius:8px;padding:7px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
nav.lessons button .n{font:500 12px var(--f-mono)}
nav.lessons button:hover{background:var(--panel);color:var(--ink)}
nav.lessons button[aria-current="true"]{background:var(--accent);color:var(--on-accent)}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:flex;flex-direction:column;gap:14px;padding-block:14px 24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
.intro{padding:12px 18px;color:var(--dim);font-size:15px}
.intro b{color:var(--ink);font-family:var(--f-display);font-size:18px;display:block}
.stage{padding:10px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.stage.with-viz{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:center}
.stage svg{display:block;width:100%;height:auto}
.node rect{fill:var(--panel);stroke:var(--line);stroke-width:1.5;transition:fill .25s,stroke .25s}
.node .t{font:600 15px var(--f-display);fill:var(--ink)}
.node .a{font:500 12.5px var(--f-body);fill:var(--accent)}
.node .s{font:400 10.5px var(--f-mono);fill:var(--dim)}
.node.on rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:3}
.edge{stroke:var(--line);stroke-width:2;stroke-dasharray:4 5;transition:stroke .25s}
.edge.hot{stroke:var(--packet);stroke-dasharray:none;stroke-width:3}
.pk circle{fill:var(--packet)}
.pk rect{fill:var(--packet-soft);stroke:var(--packet);stroke-width:1}
.pk text{font:500 12px var(--f-mono);fill:var(--ink)}
.viz canvas{display:block;width:100%;max-width:100%;aspect-ratio:320/200;border-radius:8px;background:var(--code-bg)}
.viz .cap{font-size:13px;color:var(--dim);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.sw{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:11.5px}
.sw i{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);display:inline-block}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
.story{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.stepno{font:500 12.5px var(--f-mono);color:var(--dim);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:500 12px var(--f-mono);padding:1px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.story h2{font-family:var(--f-display);font-size:23px;margin:0;line-height:1.35;text-wrap:balance}
.say{font-size:18px;line-height:1.75;margin:0;max-width:60ch}
.box{border:1.5px dashed var(--packet);border-radius:10px;padding:10px 14px;background:var(--packet-soft)}
.box.mem{border-color:var(--accent);background:var(--accent-soft)}
.box h3{font:600 12.5px var(--f-mono);letter-spacing:.04em;margin:0 0 6px;color:var(--packet)}
.box.mem h3{color:var(--accent)}
.box dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:3px 14px;margin:0;font-family:var(--f-mono);font-size:13px}
.box dt{color:var(--dim)}.box dd{margin:0;overflow-wrap:anywhere}
details.more summary{cursor:pointer;color:var(--accent);font-weight:500;font-size:14.5px;width:fit-content}
details.more div{margin-top:8px;color:var(--ink);font-size:15px}
details.more p{margin:0 0 .6em;max-width:65ch}
code{font-family:var(--f-mono);font-size:.86em;background:var(--code-bg);border:1px solid var(--line);padding:0 4px;border-radius:4px;overflow-wrap:anywhere}
.code{display:flex;flex-direction:column;overflow:hidden}
.code .head{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline;justify-content:space-between}
.code .head .lbl{font:600 13px var(--f-display);color:var(--dim)}
.code .path{font:600 13px var(--f-mono);overflow-wrap:anywhere}
.focus{display:flex;flex-direction:column;gap:12px;padding:14px 16px}
.fx-code{background:var(--hl);border-left:3px solid var(--hl-bar);border-radius:0 6px 6px 0;overflow-x:auto;padding-block:4px}
.fx-code pre{margin:0;font:13.5px/1.6 var(--f-mono);min-width:max-content}
.fx-tr{margin-top:5px;padding-left:14px;font-size:15.5px;line-height:1.55;position:relative}
.fx-tr::before{content:"";position:absolute;left:3px;top:.2em;bottom:.2em;width:2px;background:var(--accent);border-radius:2px}
.gap{font:500 12px var(--f-mono);color:var(--dim);padding-left:14px}
.ln{display:flex;padding-right:16px;border-left:3px solid transparent}
.ln .no{width:3.6em;flex:0 0 auto;text-align:right;padding-right:14px;color:var(--tk-com);user-select:none;font-variant-numeric:tabular-nums}
.fx-code .ln{border-left:0}
.fx-code .ln .no{color:var(--hl-bar);font-weight:600}
.ln .tx{white-space:pre}
.next{border-top:1px solid var(--line);padding:10px 16px;font-size:14px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.next b{font-family:var(--f-mono);font-size:12.5px;overflow-wrap:anywhere}
.full{border-top:1px solid var(--line)}
.full summary{cursor:pointer;padding:10px 16px;color:var(--accent);font-weight:500;font-size:14.5px}
.full .body{max-height:52vh;overflow:auto;background:var(--code-bg);padding-block:8px}
.full pre{margin:0;font:13px/1.65 var(--f-mono);min-width:max-content}
.full .ln.hl{background:var(--hl);border-left-color:var(--hl-bar)}
.full .ln.hl .no{color:var(--hl-bar);font-weight:600}
.kw{color:var(--tk-kw)}.st{color:var(--tk-str)}.cm{color:var(--tk-com);font-style:italic}.nu{color:var(--tk-num)}
.controls{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.controls .shell{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-block:10px}
.controls button.c{font:500 15px var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 16px;cursor:pointer}
.controls button.c:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.controls button.c:disabled{opacity:.4;cursor:default}
.controls button.next-btn{background:var(--accent);color:var(--on-accent);border-color:var(--accent);min-width:96px}
.controls button.next-btn:hover:not(:disabled){color:var(--on-accent);filter:brightness(1.08)}
.dots{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:120px;justify-content:flex-end;align-items:center}
.dots button{width:12px;height:12px;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer}
.dots button.done{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.dots button.cur{background:var(--accent);width:22px;border-radius:6px}
.count{font:500 13px var(--f-mono);color:var(--dim);font-variant-numeric:tabular-nums}
@media (max-width:900px){.row,.stage.with-viz{grid-template-columns:minmax(0,1fr)}.say{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="shell top">
  <h1>LUMA ทีละบรรทัด</h1>
  <div class="hint">เริ่มจากบท 0 แล้วกด “ถัดไป” ไปเรื่อย ๆ · <kbd>←</kbd> <kbd>→</kbd> เลื่อนทีละขั้น · <kbd>Space</kbd> เล่นเอง</div>
</header>
<nav class="lessons" aria-label="บทเรียน"><div class="shell" id="lessonTabs"></div></nav>

<main class="shell">
  <div class="card intro" id="intro"></div>
  <div class="card stage" id="stage">
    <svg id="svg" role="img" aria-label="แผนภาพการส่งข้อมูลระหว่างเครื่อง"></svg>
    <div class="viz" id="viz" hidden><canvas id="cv" width="320" height="200"></canvas><div class="cap" id="vizCap"></div></div>
  </div>
  <div class="row">
    <section class="card story" id="story" aria-live="polite"></section>
    <section class="card code" aria-label="โค้ดของขั้นนี้">
      <div class="head"><span class="lbl">โค้ดจริงของขั้นนี้</span><span class="path" id="cPath"></span></div>
      <div class="focus" id="focus"></div>
      <div class="next" id="nextInfo"></div>
      <details class="full" id="full"><summary>ดูทั้งไฟล์ (บรรทัดที่ใช้ถูกไฮไลต์)</summary><div class="body" id="cBody"><pre id="cPre"></pre></div></details>
    </section>
  </div>
</main>

<div class="controls"><div class="shell">
  <button class="c" id="prev" type="button">ย้อน</button>
  <button class="c next-btn" id="next" type="button">ถัดไป</button>
  <button class="c" id="play" type="button">เล่นเอง</button>
  <span class="count" id="count"></span>
  <div class="dots" id="dots"></div>
</div></div>

  if not target_user or not check_password_hash(target_user.password_hash, password):", "        # หากไม่ถูกต้อง ให้ตอบกลับ HTTP 401 INVALID_CREDENTIALS", "        return error_response(", "            INVALID_CREDENTIALS, ", "            \"Invalid email or password\", ", "            401", "        )", "", "    # 5. สร้าง JWT Access Token ที่มีอายุตามค่าคอนฟิก (ค่าเริ่มต้น 24 ชั่วโมง)", "    try:", "        expires_delta = current_app.config.get(\"JWT_EXPIRES_IN\") or getattr(Config, \"JWT_EXPIRES_IN\", datetime.timedelta(hours=24))", "        expiration_time = datetime.datetime.now(datetime.timezone.utc) + expires_delta", "        expires_seconds = int(expires_delta.total_seconds())", "", "        token_payload = {", "            \"user_id\": target_user.id,", "            \"email\": target_user.email,", "            \"role\": target_user.role or \"user\",", "            \"exp\": expiration_time", "        }", "        # เข้ารหัส Token ด้วย Secret Key และ Algorithm HS256", "        token = jwt.encode(token_payload, get_jwt_secret(), algorithm=\"HS256\")", "    except Exception as e:", "        return error_response(", "            INTERNAL_SERVER_ERROR, ", "            f\"Failed to generate access token: {str(e)}\", ", "            500", "        )", "", "    # 6. ส่งผลลัพธ์การเข้าสู่ระบบสำเร็จพร้อม Token กลับไปยัง Frontend (HTTP 200 OK)", "    return success_response({", "        \"access_token\": token,", "        \"token_type\": \"Bearer\",", "        \"expires_in\": expires_seconds,", "        \"user\": target_user.to_dict()", "    }, status_code=200)"]}, "jwt_py": {"path": "backend/app/middleware/jwt_auth.py", "lang": "py", "start": 48, "lines": ["    @wraps(f)", "    def decorated(*args, **kwargs):", "        # 1. ดึงค่า Header \"Authorization\" จากคำขอที่ส่งมาจาก Frontend", "        auth_header = request.headers.get(\"Authorization\")", "        if not auth_header:", "            # หากไม่มี Header ให้ตอบกลับ 401 UNAUTHORIZED ทันที", "            return error_response(UNAUTHORIZED, \"Authorization header is missing\", 401)", "", "        # 2. แยกข้อความใน Header ออกเป็นส่วน (คาดหวังรูปแบบ: \"Bearer <token_string>\")", "        parts = auth_header.split()", "        if len(parts) != 2 or parts[0].lower() != \"bearer\":", "            # หากรูปแบบไม่ใช่ \"Bearer <token>\" ให้ปฏิเสธคำขอ", "            return error_response(", "                UNAUTHORIZED, ", "                \"Invalid Authorization header format. Must be 'Bearer <token>'\", ", "                401", "            )", "", "        # ดึงสตริง Token ออกมาใช้งาน", "        token = parts[1]", "", "        # 3. ถอดรหัสและตรวจสอบความถูกต้องของ Token", "        try:", "            # ตรวจสอบความถูกต้องด้วย Secret Key และ Algorithm HS256", "            payload = jwt.decode(token, get_jwt_secret(), algorithms=[\"HS256\"])", "            ", "            # ดึง user_id และ email ออกมาจาก Payload", "            request.user_id = payload.get(\"user_id\")", "            request.user_email = payload.get(\"email\")", "", "            # ตรวจสอบว่าใน Payload มี user_id หรือไม่", "            if not request.user_id:", "                return error_response(UNAUTHORIZED, \"Token payload is missing user_id\", 401)", "", "        except jwt.ExpiredSignatureError:", "            # กรณี Token หมดอายุ (เกิน 24 ชั่วโมง)", "            return error_response(UNAUTHORIZED, \"Token has expired, please log in again\", 401)", "        except jwt.InvalidTokenError:", "            # กรณี Token ผิดรูปแบบ หรือถูกดัดแปลงแก้ไข", "            return error_response(UNAUTHORIZED, \"Invalid token signature\", 401)", "        except Exception as e:", "            # กรณีเกิดข้อผิดพลาดอื่นๆ ที่ไม่คาดคิด", "            return error_response(INTERNAL_SERVER_ERROR, f\"Authentication error: {str(e)}\", 500)", "", "        # 4. เมื่อผ่านการตรวจสอบสิทธิ์ครบถ้วน ให้ส่งต่อไปยังฟังก์ชัน Route หลัก", "        return f(*args, **kwargs)", "", "    return decorated"]}, "history_py": {"path": "backend/app/routes/history.py", "lang": "py", "start": 26, "lines": ["@history_bp.route(\"/history\", methods=[\"GET\"])", "@token_required", "def get_history():", "    \"\"\"", "    GET /api/v1/history 🔒 (ต้องใช้ JWT Token)", "    ดึงรายการประวัติการสร้างภาพของผู้ใช้งานปัจจุบัน โดยแยกตาม user_id อย่างเด็ดขาด", "    ", "    Query Parameters ที่รองรับ:", "    - category : กรองตามหมวดหมู่ ('sd_generate' สำหรับแบบที่ 1, 'image_filter' สำหรับแบบที่ 2)", "    - type     : กรองตามประเภท ('checkpoint' หรือ 'sub_function')", "    - page     : หมายเลขหน้าที่ต้องการดู (ค่าเริ่มต้น: 1)", "    - limit    : จำนวนรายการต่อหน้า (ค่าเริ่มต้น: 20 รายการ)", "    \"\"\"", "    # 1. รับค่า Query Parameters จาก URL (Frontend ส่งเฉพาะ page, limit)", "    page = request.args.get(\"page\", default=1, type=int)", "    limit = request.args.get(\"limit\", default=20, type=int)", "", "    # 2. สร้าง Base Query ที่กรองเฉพาะข้อมูลของผู้ใช้ปัจจุบันเท่านั้น (User Isolation)", "    query = Generation.query.filter_by(user_id=request.user_id)", "", "    # 4. เรียงลำดับจากภาพล่าสุดไปเก่าสุด (created_at DESC) และแบ่งหน้า Pagination", "    pagination = query.order_by(Generation.created_at.desc()).paginate(", "        page=page, ", "        per_page=limit, ", "        error_out=False", "    )", "", "    # 5. แปลง Object แต่ละรายการเป็น Dictionary พร้อมข้อมูลประเภทภาพที่ชัดเจน", "    history_items = [item.to_dict() for item in pagination.items]", "", "    # 6. ส่งผลลัพธ์กลับไปยัง Frontend พร้อมโครงสร้าง Pagination ครบถ้วน", "    return success_response({", "        \"history\": history_items,", "        \"pagination\": {", "            \"page\": pagination.page,", "            \"limit\": pagination.per_page,", "            \"total\": pagination.total,", "            \"total_pages\": pagination.pages,", "        }", "    }, status_code=200)"]}, "sd_gen": {"path": "backend/app/routes/sd.py", "lang": "py", "start": 68, "lines": ["@sd_bp.route(\"/generate\", methods=[\"POST\"])", "@token_required", "def generate_image():", "    \"\ in [512, 768, 1024] or height not in [512, 768, 1024]:", "        return error_response(", "            VALIDATION_ERROR, ", "            \"Width and Height must be 512, 768, or 1024\", ", "            400", "        )", "", "    if not (1 <= steps <= 50):", "        return error_response(", "            VALIDATION_ERROR, ", "            \"Steps must be between 1 and 50\", ", "            400", "        )", "", "    if not (1.0 <= cfg_scale <= 20.0):", "        return error_response(", "            VALIDATION_ERROR, ", "            \"CFG Scale must be between 1 and 20\", ", "            400", "        )", "", "    sampler = data.get(\"sampler\") or data.get(\"sampler_name\") or \"Euler a\"", "    checkpoint = data.get(\"checkpoint\", \"\")", "", "    # รวมค่าพารามิเตอร์ที่ผ่าน Type Conversion แล้ว", "    clean_payload = dict(data)", "    clean_payload.update({", "        \"prompt\": prompt,", "        \"negative_prompt\": negative_prompt,", "        \"width\": width,", "        \"height\": height,", "        \"steps\": steps,", "        \"cfg_scale\": cfg_scale,", "        \"sampler\": sampler,", "        \"checkpoint\": checkpoint,", "        \"seed\": seed,", "    })", "", "    try:", "        # 3. ส่งคำสั่งไปยัง AI Server ผ่านระบบ Concurrency Queue", "        base64_image, actual_duration, estimated_duration = generate_sd_image(clean_payload)", "", "        # 4. ถอดรหัสข้อความ Base64 ให้เป็น Binary Bytes เพื่อจัดเก็บลงฐานข้อมูล", "        image_bytes = base64.b64decode(base64_image)", "", "        # 5. สร้างเรคคอร์ดใหม่ในตาราง generations (กำหนด category='sd_generate' สำหรับรูปแบบที่ 1)", "        new_generation = Generation(", "            user_id=request.user_id,             # 🔑 ผูกไอดีเจ้าของภาพจาก JWT Token", "            category=\"sd_generate\",               # 🏷️ รูปแบบที่ 1: สร้างจาก AI Checkpoint", "            action_type=\"txt2img\",                # ⚙️ ชนิดการทำงาน: Text-to-Image", "            prompt=prompt,", "            negative_prompt=negative_prompt,", "            checkpoint=checkpoint,", "            sampler=sampler,", "            width=width,", "            height=height,", "            steps=steps,", "            cfg_scale=cfg_scale,", "            seed=seed,", "            params=json.dumps(data),              # บันทึกพารามิเตอร์ทั้งหมดในรูปแบบ JSON", "            image_data=image_bytes,               # เก็บข้อมูลภาพ Binary ลง SQLite", "        )", "", "        # 6. เพิ่มข้อมูลและบันทึกลงใน Database", "        db.session.add(new_generation)", "        db.session.commit()", "", "        # 6.1 บันทึกไฟล์ภาพลงใน Disk Storage (uploads/generations/{id}.png) เพื่อประสิทธิภาพการดึงข้อมูล", "        upload_folder = current_app.config.get(\"UPLOAD_FOLDER\")", "        if upload_folder:", "            gen_dir = os.path.join(upload_folder, \"generations\")", "            os.makedirs(gen_dir, exist_ok=True)", "            disk_path = os.path.join(gen_dir, f\"{new_generation.id}.png\")", "            try:", "                with open(disk_path, \"wb\") as img_file:", "                    img_file.write(image_bytes)", "                new_generation.image_path = disk_path", "                db.session.commit()", "            except Exception as io_err:", "                current_app.logger.warning(\"Failed to save image to disk storage: %s\", str(io_err))", "", "        # 7. ตอบกลับผลลัพธ์ตามมาตรฐาน LUMA Contract พร้อมเวลาประมาณและเวลาจริง", "        return success_response({", "            \"generation_id\": new_generation.id,", "            \"image_url\": f\"/api/v1/images/{new_generation.id}\",", "            \"seed\": new_generation.seed,", "            \"estimated_time_seconds\": estimated_duration,", "            \"actual_time_seconds\": actual_duration,", "            \"created_at\": new_generation.created_at.isoformat() if new_generation.created_at else None,", "        }, status_code=201)", "", "    except AIServerBusyException as exc:", "        db.session.rollback()", "        return error_response(AI_SERVER_BUSY, str(exc), 409)", "    except AIServerTimeoutException as exc:", "        db.session.rollback()", "        return error_response(AI_SERVER_TIMEOUT, str(exc), 504)", "    except AIServerErrorException as exc:", "        db.session.rollback()", "        return error_response(AI_SERVER_ERROR, str(exc), 503)", "    except Exception as e:", "        db.session.rollback()", "        return error_response(GENERATION_FAILED, f\"Image generation failed: {str(e)}\", 500)"]}, "sd_img": {"path": "backend/app/routes/sd.py", "lang": "py", "start": 224, "lines": ["@sd_bp.route(\"/images/<int:gen_id>\", methods=[\"GET\"])", "@token_required", "def stream_image(gen_id: int):", "    \"\"\"", "    GET /api/v1/images/:gen_id 🔒 (ต้องใช้ JWT Token)", "    เส้นทางสำหรับส่งไฟล์รูปภาพแบบไบนารี (Binary Stream, image/png) กลับไปแสดงผลบน Frontend", "    ", "    🛡️ ระบบป้องกันการข้ามสิทธิ์และ IDOR (Anti-Hopping & Ownership Protection):", "    - ค้นหารูปภาพโดยระบุทั้ง id และ user_id จาก Token เสมอ", "    - หากผู้ใช้พยายามเปิดดูภาพของคนอื่น ระบบจะมองไม่เห็นภาพนั้น และตอบกลับ 404 ทันที", "    ⚡ ประสิทธิภาพสูง: สตรีมตรงจากไฟล์ Disk ก่อน หากไม่มีจึงดึงจาก Database BLOB", "    \"\"\"", "    # 1. ค้นหารูปภาพโดยกรองเฉพาะภาพที่เป็นของผู้ใช้คนนี้เท่านั้น", "    record = Generation.query.filter_by(", "        id=gen_id, ", "        user_id=request.user_id", "    ).first()", "", "    # 2. หากไม่พบภาพ หรือภาพนั้นไม่ใช่ของผู้ใช้คนนี้", "    if not record:", "        return error_response(", "            GENERATION_NOT_FOUND, ", "            \"Image record not found or access denied\", ", "            404", "        )", "", "    # 3. หากมีไฟล์บน Disk Storage ให้ Stream ตรงจากไฟล์ (ใช้ OS sendfile เร็วกว่าและประหยัด RAM)", "    if record.image_path and os.path.isfile(record.image_path):", "        return send_file(", "            record.image_path,", "            mimetype=\"image/png\",", "            as_attachment=False,", "            download_name=f\"luma_image_{gen_id}.png\"", "        )", "", "    # 4. หากไม่มีไฟล์บน Disk ให้ดึงข้อมูลสำรองจาก image_data ใน Database", "    if record.image_data:", "        return send_file(", "            BytesIO(record.image_data),", "            mimetype=\"image/png\",", "            as_attachment=False,", "            download_name=f\"luma_image_{gen_id}.png\"", "        )", "", "    # 5. หากไม่มีทั้งสองแห่ง", "    return error_response(", "        IMAGE_NOT_FOUND, ", "        \"Image binary data is missing in database or storage\", ", "        404", "    )"]}, "ai_py": {"path": "backend/app/services/ai_client.py", "lang": "py", "start": 168, "lines": ["def generate_sd_image(payload: dict) -> tuple:", "    \"\"\"", "    ฟังก์ชันส่งคำขอสร้างรูปภาพไปยัง Stable Diffusion AI Server (/sdapi/v1/txt2img)", "    ", "    ✨ ระบบจัดการคิวงานพร้อมกัน (Concurrency Queue Management):", "    - เมื่อผู้ใช้หลายคนกดสร้างภาพพร้อมกัน คำขอจะถูกนำเข้าคิว", "    - คำขอแต่ละงานจะรอเข้า GPU อย่างเป็นระเบียบ ไม่ชนกัน และไม่สูญหาย", "    - จับเวลาจริงในการทำงานเพื่อส่งกลับเป็นค่าสถิติ", "    ", "    :param payload: ข้อมูลพารามิเตอร์การสร้างภาพจากผู้ใช้งาน", "    :return: Tuple ของ (base64_image_string, actual_duration_seconds, estimated_duration_seconds)", "    \"\"\"", "    global _waiting_jobs_count", "    server_url = get_ai_server_url()", "", "    # 1. คำนวณเวลาประเมินล่วงหน้าก่อนเข้าคิว", "    width = int(payload.get(\"width\", 512))", "    height = int(payload.get(\"height\", 512))", "    steps = int(payload.get(\"steps\", 20))", "    est_info = calculate_estimated_time(width=width, height=height, steps=steps)", "    estimated_duration = est_info[\"total_estimated_seconds\"]", "", "    # 2. บันทึกเพิ่มจำนวนคิวงานที่กำลังรอในระบบ", "    with _waiting_counter_lock:", "        _waiting_jobs_count += 1", "        current_queue_pos = _waiting_jobs_count", "", "    logger.info(\"New generation request queued (Position: %d, Estimated: %.1fs)\", current_queue_pos, estimated_duration)", "", "    # 3. รอเข้าคิวเพื่อขอสิทธิ์การใช้งาน GPU (กำหนดไว้ 40 วินาที เพื่อให้รวมกับ HTTP Timeout 75s แล้วไม่เกิน 115s < Nginx 120s)", "    lock_acquired = _gpu_lock.acquire(blocking=True, timeout=40)", "", "    # 4. เมื่อได้รับสิทธิ์หรือหลุดจากคิว ให้ลดจำนวนงานที่รอลง", "    with _waiting_counter_lock:", "        _waiting_jobs_count = max(0, _waiting_jobs_count - 1)", "", "    # หากรอคิวนานเกิน 40 วินาทีแล้วยังไม่ได้คิว ให้ตอบกลับ AI_SERVER_BUSY (409) ก่อน Nginx ตัด 504", "    if not lock_acquired:", "        logger.warning(\"Generation request timed out waiting for GPU lock (Server Busy)\")", "        raise AIServerBusyException(\"AI Server queue wait time exceeded (Server is busy)\")", "", "    logger.info(\"Acquired GPU lock. Sending txt2img request to AI Server: %s\", server_url)", "", "    # 5. เริ่มจับเวลาการประมวลผลจริง", "    start_time = time.time()", "", "    try:", "        # 6. แปลงโครงสร้างพารามิเตอร์ให้ตรงตามที่ Stable Diffusion WebUI API กำหนด", "        sd_payload = {", "            \"prompt\": payload.get(\"prompt\", \"\"),", "            \"negative_prompt\": payload.get(\"negative_prompt\", \"\"),", "            \"width\": width,", "            \"height\": height,", "            \"steps\": steps,", "            \"cfg_scale\": float(payload.get(\"cfg_scale\", 7.0)),", "            \"seed\": int(payload.get(\"seed\", -1)),", "            \"sampler_name\": payload.get(\"sampler\") or payload.get(\"sampler_name\") or \"Euler a\",", "        }", "", "        # หากมีการระบุชื่อโมเดล Checkpoint ให้ส่งไปใน override_settings", "        checkpoint_name = payload.get(\"checkpoint\")", "        if checkpoint_name:", "            sd_payload[\"override_settings\"] = {", "                \"sd_model_checkpoint\": checkpoint_name", "            }", "", "        # 7. ส่ง HTTP POST Request ไปยัง AI Server", "        timeout_seconds = get_ai_server_timeout()", "        response = requests.post(", "            f\"{server_url}/sdapi/v1/txt2img\",", "            json=sd_payload,", "            timeout=timeout_seconds", "        )", "", "        # 8. ตรวจสอบผลลัพธ์จาก AI Server", "        if response.status_code == 200:", "            result_data = response.json()", "            images_list = result_data.get(\"images\", [])", "            ", "            if images_list and len(images_list) > 0:", "                # คำนวณเวลาที่ใช้ไปจริง (หน่วย: วินาที)", "                actual_duration = round(time.time() - start_time, 2)", "                logger.info(\"Image generated successfully in %.2fs (Estimated was: %.1fs)\", actual_duration, estimated_duration)", "                # ส่งคืน Base64 ของภาพแรก, เวลาที่ใช้จริง, และเวลาประเมิน", "                return images_list[0], actual_duration, estimated_duration", "                ", "            logger.error(\"AI Server returned HTTP 200 but image data array was empty\")", "            raise AIServerErrorException(\"AI Server returned empty image data\")", "", "        logger.error(\"AI Server returned unexpected HTTP status %d\", response.status_code)", "        raise AIServerErrorException(f\"AI Server returned status code {response.status_code}\")", "", "    except requests.exceptions.Timeout:", "        logger.error(\"AI Server request timed out after %d seconds\", get_ai_server_timeout())", "        # กรณี AI Server ใช้เวลาเจนภาพนานเกินกำหนด", "        raise AIServerTimeoutException(f\"AI Server timed out after {get_ai_server_timeout()} seconds\")", "    except requests.exceptions.RequestException as e:", "        logger.error(\"Network communication error with AI Server: %s\", str(e))", "        # กรณีเกิดปัญหาเครือข่ายเชื่อมต่อไม่ได้", "        raise AIServerErrorException(f\"AI Server communication error: {str(e)}\")", "    finally:", "        # 9. ปลดปล่อย Lock บน GPU ทุกครั้ง เพื่อให้คำขอในคิวถัดไปเริ่มทำงานต่อได้ทันที", "        _gpu_lock.release()", "        logger.debug(\"GPU lock released\")"]}, "routes_spot": {"path": "backend/app/services/image_filters/routes.py", "lang": "py", "start": 33, "lines": ["@process_bp.route(\"/process/spot-blur\", methods=[\"POST\"])", "@token_required", "def process_spot_blur():", "    \"\"\"POST /api/v1/process/spot-blur 🔒 เบลอเฉพาะจุดตามวงกลม แล้วส่งกลับเป็น PNG\"\"\"", "    file = request.files.get(\"image\")", "    form = request.form", "", "    # 1. ไฟล์ภาพ", "    if not file:", "        return error_response(VALIDATION_ERROR, \"image file is required\", 400)", "    if not file.filename.lower().endswith((\".jpg\", \".jpeg\", \".png\", \".webp\")):", "        return error_response(UNSUPPORTED_FILE_TYPE, \"Only .jpg, .jpeg, .png, .webp are supported\", 415)", "", "    # 2. พารามิเตอร์: circles = [[x, y, r], ...], strength = 1-30, soft = \"true\"/\"false\"", "    try:", "        circles = json.loads(form.get(\"circles\", \"\"))", "        strength = int(form.get(\"strength\", \"\"))", "    except ValueError:", "        circles, strength = None, 0", "    soft = form.get(\"soft\", \"true\")", "", "    valid = (", "        isinstance(circles, list) and len(circles) > 0", "        and all(", "            isinstance(c, list) and len(c) == 3", "            and all(type(v) in (int, float) for v in c)", "            and c[2] > 0", "            for c in circles", "        )", "        and 1 <= strength <= 30", "        and soft in (\"true\", \"false\")", "    )", "    if not valid:", "        return error_response(", "            VALIDATION_ERROR,", "            \"circles must be a non-empty JSON array of [x, y, radius], \"", "            'strength must be an integer 1-30, soft must be \"true\" or \"false\"',", "            400,", "        )", "", "    # 3. decode ภาพ (IMREAD_COLOR ทำให้เป็น BGR 3 ช่องเสมอ)", "    data = file.read()", "    img = cv2.imdecode(np.frombuffer(data, np.uint8), cv2.IMREAD_COLOR) if data else None", "    if img is None:", "        return error_response(INVALID_IMAGE, \"Unable to decode the uploaded image\", 400)", "", "    # 4. เบลอ แล้วส่งกลับเป็น PNG", "    result = spot_blur(img, circles, strength=strength, soft=(soft == \"true\"))", "    png = cv2.imencode(\".png\", result)[1].tobytes()", "    return send_file(BytesIO(png), mimetype=\"image/png\")"]}, "spot_py": {"path": "backend/app/services/image_filters/spot_blur.py", "lang": "py", "start": 1, "lines": ["import cv2", "import numpy as np", "", "", "def spot_blur(img, circles, strength=10, soft=True):", "    \"\"\"เบลอเฉพาะจุดเป็นวงกลม", "", "    img      : ภาพ (BGR)", "    circles  : รายการวงกลม [(x, y, radius), ...] หน่วยเป็น pixel ของภาพจริง", "               ลากเมาส์ 1 ครั้ง = หลายวงกลมต่อกัน เหมือนระบายด้วยพู่กัน", "    strength : ความแรงของการเบลอ 1-30", "    soft     : True = ขอบวงกลมค่อย ๆ จางลง (ดูเนียน), False = ขอบคม", "    \"\"\"", "    # 1) เบลอทั้งภาพเตรียมไว้", "    k = strength * 2 + 1", "    blurred = cv2.GaussianBlur(img, (k, k), 0)", "", "    # 2) สร้าง mask: วาดวงกลมสีขาว (1) บนพื้นดำ (0) ตรงที่ผู้ใช้เลือก", "    mask = np.zeros(img.shape[:2], np.float32)", "    for x, y, r in circles:", "        cv2.circle(mask, (int(x), int(y)), int(r), 1.0, -1)", "", "    # 3) ทำขอบ mask ให้นุ่ม รอยต่อระหว่างส่วนที่เบลอกับไม่เบลอจะได้ไม่เป็นเส้นแข็ง", "    if soft and circles:", "        edge = int(max(r for _, _, r in circles) * 0.5) * 2 + 1", "        mask = cv2.GaussianBlur(mask, (edge, edge), 0)", "", "    # 4) ผสมภาพ: ตรงไหน mask = 1 ใช้ภาพเบลอ, mask = 0 ใช้ภาพเดิม, ค่ากลาง ๆ ผสมกัน", "    mask = mask[:, :, None]", "    out = img * (1 - mask) + blurred * mask"]}, "rb_py": {"path": "backend/app/services/image_filters/remove_bg.py", "lang": "py", "start": 46, "lines": ["def _person_prob(img):", "    \"\"\"คืนค่า 0-1 ต่อ pixel ว่าเป็นคน (= 1 - ความน่าจะเป็นที่เป็นพื้นหลัง)\"\"\"", "    rgb = cv2.cvtColor(img, cv2.COLOR_BGR2RGB)", "    with _lock:", "        result = _get_segmenter().segment(mp.Image(image_format=mp.ImageFormat.SRGB, data=rgb))", "    background = np.squeeze(result.confidence_masks[0].numpy_view()).astype(np.float32)", "    return 1.0 - background", "", "", "def _largest_blob(mask, extra=None):", "    \"\"\"เก็บก้อนที่ใหญ่ที่สุด (+ ก้อนที่ทับกับ extra ถ้ามี) ก้อนอื่นทิ้ง\"\"\"", "    n, labels, stats, _ = cv2.connectedComponentsWithStats(mask.astype(np.uint8))", "    if n <= 1:", "        return mask.astype(bool)", "    keep = {1 + int(np.argmax(stats[1:, cv2.CC_STAT_AREA]))}", "    if extra is not None:", "        keep |= set(np.unique(labels[extra]).tolist()) - {0}", "    return np.isin(labels, list(keep))", "", "", "# ==============================================================================", "# ตัดพื้นหลัง (ทำที่รูปย่อ)", "# ==============================================================================", "", "def _cut(img, person, rect, strokes):", "    \"\"\"คืน alpha 0-1 ของสิ่งที่เก็บไว้", "", "    person  : ผลจาก AI (None = ไม่ใช้ AI)", "    rect    : [x, y, w, h] หรือ None", "    strokes : [{\"type\": \"keep\"/\"remove\", \"r\": รัศมี, \"points\": [[x, y], ...]}, ...]", "    \"\"\"", "    H, W = img.shape[:2]", "", "    # 1) ไม่ลากกรอบและไม่ระบาย -> ใช้ AI อย่างเดียว (เร็วที่สุด)", "    if rect is None and not strokes:", "        soft = np.clip((person - 0.3) / 0.4, 0, 1)                  # ขอบนุ่มตามความมั่นใจ", "        return _largest_blob(person > 0.5).astype(np.float32) * soft", "", "    # 2) mask เริ่มต้นของ GrabCut", "    #    GC_BGD = พื้นหลังแน่นอน, GC_FGD = พื้นหน้าแน่นอน", "    #    GC_PR_BGD / GC_PR_FGD = \"น่าจะ\" เป็นพื้นหลัง / พื้นหน้า (GrabCut เปลี่ยนได้)", "    x, y, w, h = rect if rect is not None else (0, 0, W, H)", "    x0, y0 = max(0, int(x)), max(0, int(y))", "    x1, y1 = min(W, int(x + w)), min(H, int(y + h))", "    inside = np.zeros((H, W), bool)", "    inside[y0:y1, x0:x1] = True", "", "    mask = np.full((H, W), cv2.GC_BGD, np.uint8)                    # นอกกรอบ = พื้นหลังแน่นอน", "    if person is not None:", "        mask[inside] = cv2.GC_PR_BGD                                 # ในกรอบ = น่าจะพื้นหลัง", "        mask[inside & (person > 0.5)] = cv2.GC_PR_FGD                # ...ยกเว้นที่ AI บอกว่าเป็นคน", "        mask[inside & (person > 0.9)] = cv2.GC_FGD                   # AI มั่นใจมาก = แน่นอน", "    else:", "        mask[inside] = cv2.GC_PR_FGD                                 # ไม่มี AI: ให้สีเป็นตัวตัดสิน", "", "    # 3) เส้นที่ผู้ใช้ระบาย = คำตอบแน่นอน (ทับทุกอย่าง)", "    for s in strokes:", "        pts = np.array(s[\"points\"], np.int32).reshape(-1, 2)", "        value = cv2.GC_FGD if s[\"type\"] == \"keep\" else cv2.GC_BGD", "        r = max(1, int(s[\"r\"]))", "        if len(pts) == 1:", "            cv2.circle(mask, (int(pts[0][0]), int(pts[0][1])), r, value, -1)", "        else:", "            cv2.polylines(mask, [pts], False, value, r * 2)", "", "    # 4) GrabCut ต้องมีทั้งพื้นหน้าและพื้นหลังอย่างละนิด ไม่งั้นสร้างโมเดลสีไม่ได้", "    fg = np.isin(mask, (cv2.GC_FGD, cv2.GC_PR_FGD))", "    if fg.all() or not fg.any():", "        return fg.astype(np.float32)", "    bgd_model = np.zeros((1, 65), np.float64)", "    fgd_model = np.zeros((1, 65), np.float64)", "    cv2.grabCut(img, mask, None, bgd_model, fgd_model, 4, cv2.GC_INIT_WITH_MASK)", "    fg = np.isin(mask, (cv2.GC_FGD, cv2.GC_PR_FGD))", "", "    # 5) ทิ้งเศษเล็ก ๆ แต่เก็บก้อนที่ผู้ใช้ระบาย \"เก็บ\" ไว้เสมอ", "    return _largest_blob(fg, extra=(mask == cv2.GC_FGD)).astype(np.float32)", "", "", "# ==============================================================================", "# ฟังก์ชันหลัก", "# ==============================================================================", "", "def remove_background(img, rect=None, strokes=None, use_ai=True, bg_color=None):", "    \"\"\"ลบพื้นหลัง", "", "    img      : ภาพ (BGR) ความละเอียดเต็ม", "    rect     : กรอบที่ผู้ใช้ลาก [x, y, w, h] หน่วย pixel ของรูปจริง (None = ไม่มีกรอบ)", "    strokes  : เส้นแปรง [{\"type\": \"keep\"/\"remove\", \"r\": รัศมี, \"points\": [[x, y], ...]}, ...]", "    use_ai   : ใช้ AI หา \"คน\" เป็นจุดเริ่ม (False = GrabCut ล้วน ต้องมีกรอบ)", "    bg_color : None = พื้นโปร่งใส (คืน BGRA), (B, G, R) = เติมสีพื้น (คืน BGR)", "    \"\"\"", "    strokes = strokes or []", "    H, W = img.shape[:2]", "", "    # 1) ย่อรูป และย่อพิกัดกรอบ/แปรงตามสัดส่วนเดียวกัน", "    s = min(1.0, WORK_SIDE / max(H, W))", "    small = cv2.resize(img, (round(W * s), round(H * s)), interpolation=cv2.INTER_AREA) if s < 1 else img", "    small_rect = [v * s for v in rect] if rect is not None else None", "    small_strokes = [", "        {\"type\": st[\"type\"], \"r\": max(1, round(st[\"r\"] * s)),", "         \"points\": [[p[0] * s, p[1] * s] for p in st[\"points\"]]}", "        for st in strokes", "    ]", "", "    # 2) หา alpha ที่รูปย่อ", "    person = _person_prob(small) if use_ai else None", "    alpha_small = _cut(small, person, small_rect, small_strokes)", "", "    # 3) ประมาณ \"สีพื้นหลังเดิม\" รอบ ๆ ตัว (ที่รูปย่อ เพราะต้องเบลอแรง ทำที่รูปใหญ่จะช้า)", "    #    = ค่าเฉลี่ยถ่วงน้ำหนักเฉพาะ pixel ที่เป็นพื้นหลัง", "    bg_w = 1.0 - alpha_small", "    bg_small = cv2.GaussianBlur(small.astype(np.float32) * bg_w[:, :, None], (0, 0), 12) / \\", "        np.maximum(cv2.GaussianBlur(bg_w, (0, 0), 12), 1e-3)[:, :, None]", "", "    # 4) ขยายกลับเป็นขนาดเต็ม + ทำขอบนุ่ม", "    alpha = cv2.resize(alpha_small, (W, H), interpolation=cv2.INTER_LINEAR)", "    alpha = cv2.GaussianBlur(alpha, (0, 0), max(1.0, 1.0 / s))", "    bg_old = cv2.resize(bg_small, (W, H), interpolation=cv2.INTER_LINEAR)", "", "    # 5) ลบสีพื้นเดิมที่ติดขอบ จากสมการ  I = a*F + (1-a)*B  ->  F = (I - (1-a)*B) / a", "    a = alpha[:, :, None]", "    I = img.astype(np.float32)", "    F = np.clip((I - (1 - a) * bg_old) / np.maximum(a, 0.15), 0, 255)", "    F = np.where(a > 0.95, I, F)                                       # ตรงกลางตัวใช้สีเดิม", "", "    # 6) ประกอบผลลัพธ์", "    if bg_color is None:", "        return np.dstack([F, alpha * 255]).astype(np.uint8)             # BGRA โปร่งใส", "    out = F * a + np.array(bg_color, np.float32) * (1 - a)", "    return out.astype(np.uint8)                                          # BGR พร้อมสีพื้น"]}, "routes_cart": {"path": "backend/app/services/image_filters/routes.py", "lang": "py", "start": 245, "lines": ["@process_bp.route(\"/process/cartoonize\", methods=[\"POST\"])", "@token_required", "def process_cartoonize():", "    \"\"\"POST /api/v1/process/cartoonize 🔒 แปลงภาพถ่ายเป็นสไตล์การ์ตูน/อนิเมะ แล้วส่งกลับเป็น PNG\"\"\"", "    file = request.files.get(\"image\")", "    form = request.form", "", "    # 1. ไฟล์ภาพ", "    if not file:", "        return error_response(VALIDATION_ERROR, \"image file is required\", 400)", "    if not file.filename.lower().endswith((\".jpg\", \".jpeg\", \".png\", \".webp\")):", "        return error_response(UNSUPPORTED_FILE_TYPE, \"Only .jpg, .jpeg, .png, .webp are supported\", 415)", "", "    # 2. พารามิเตอร์: num_colors (2-32), line_thickness (1-5), smoothness (1-10)", "    try:", "        num_colors = int(form.get(\"num_colors\", 8))", "        line_thickness = int(form.get(\"line_thickness\", 2))", "        smoothness = int(form.get(\"smoothness\", 5))", "    except (ValueError, TypeError):", "        num_colors, line_thickness, smoothness = 8, 2, 5", "", "    valid = (", "        2 <= num_colors <= 32", "        and 1 <= line_thickness <= 5", "        and 1 <= smoothness <= 10", "    )", "    if not valid:", "        return error_response(", "            VALIDATION_ERROR,", "            \"num_colors must be an integer 2-32, line_thickness 1-5, smoothness 1-10\",", "            400,", "        )", "", "    # 3. decode ภาพ (IMREAD_COLOR ทำให้เป็น BGR 3 ช่องเสมอ)", "    data = file.read()", "    img = cv2.imdecode(np.frombuffer(data, np.uint8), cv2.IMREAD_COLOR) if data else None", "    if img is None:", "        return error_response(INVALID_IMAGE, \"Unable to decode the uploaded image\", 400)", "", "    # 4. แปลงภาพสไตล์การ์ตูน แล้วส่งกลับเป็น PNG", "    try:", "        result = cartoonize(img, num_colors=num_colors, line_thickness=line_thickness, smoothness=smoothness)", "    except Exception as e:", "        return error_response(GENERATION_FAILED, f\"Cartoonize failed: {str(e)}\", 500)", "", "    png = cv2.imencode(\".png\", result)[1].tobytes()", "    return send_file(BytesIO(png), mimetype=\"image/png\")"]}, "cart_py": {"path": "backend/app/services/image_filters/cartoonize.py", "lang": "py", "start": 9, "lines": ["", "def cartoonize(", "    img: np.ndarray,", "    num_colors: int = 8,", "    line_thickness: int = 2,", "    smoothness: int = 5,", ") -> np.ndarray:", "    \"\"\"แปลงภาพถ่ายเป็นสไตล์การ์ตูน/อนิเมะ (Anime / Comic Stylization)", "", "    :param img: ภาพต้นฉบับ BGR (np.ndarray)", "    :param num_colors: จำนวนสีหลักที่ต้องการจัดกลุ่ม (K-Means clusters: 4 - 32)", "    :param line_thickness: ความหนาของเส้นขอบหมึก (1 - 5)", "    :param smoothness: ความเนียนของพื้นผิวด้วย Bilateral Filter (1 - 10)", "    :return: ภาพสไตล์การ์ตูน BGR", "    \"\"\"", "    # 1. เกลี่ยผิวภาพแบบรักษาเส้นขอบ (Bilateral Filtering)", "    d = max(3, int(smoothness) * 2 + 1)", "    sigma = int(smoothness) * 15", "    color = img.copy()", "    for _ in range(max(1, int(smoothness) // 2)):", "        color = cv2.bilateralFilter(color, d=d, sigmaColor=sigma, sigmaSpace=sigma)", "", "    # 2. ลดทอนจำนวนเฉดสีด้วย K-Means Clustering (Machine Learning)", "    pixels = np.float32(color.reshape((-1, 3)))", "    criteria = (cv2.TERM_CRITERIA_EPS + cv2.TERM_CRITERIA_MAX_ITER, 20, 0.001)", "    k = max(2, min(32, int(num_colors)))", "    _, labels, centers = cv2.kmeans(pixels, k, None, criteria, 10, cv2.KMEANS_RANDOM_CENTERS)", "    quantized = np.uint8(centers)[labels.flatten()].reshape(img.shape)", "", "    # 3. สกัดเส้นโครงร่างหมึก (Cartoon Ink Outlines)", "    gray = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)", "    gray_blurred = cv2.medianBlur(gray, 7)", "    edges = cv2.adaptiveThreshold(", "        gray_blurred, 255, cv2.ADAPTIVE_THRESH_MEAN_C, cv2.THRESH_BINARY, blockSize=9, C=2", "    )", "", "    thickness = int(line_thickness)", "    if thickness > 1:", "        kernel = cv2.getStructuringElement(cv2.MORPH_RECT, (thickness, thickness))", "        edges = cv2.erode(edges, kernel)", "", "    # 4. รวมเส้นขอบสีดำเข้ากับเลเยอร์สี", "    edges_bgr = cv2.cvtColor(edges, cv2.COLOR_GRAY2BGR)", "    return cv2.bitwise_and(quantized, edges_bgr)"]}}, "lessons": [{"id": "l0", "title": "รู้จักระบบก่อน", "short": "รู้จักระบบ", "intro": "ลองนึกภาพร้านอาหาร: ลูกค้าสั่งที่หน้าร้าน พนักงานต้อนรับรับออเดอร์ไปส่งห้องครัว ห้องครัวจดลงสมุด และถ้าต้องใช้เตาพิเศษก็ส่งไปให้เชฟพิเศษ ระบบ LUMA ทำงานแบบเดียวกัน บทนี้แนะนำทีละเครื่อง ยังไม่มีข้อมูลวิ่ง", "stage": {"h": 270, "nodes": [{"id": "browser", "x": 20, "y": 28, "t": "Browser", "a": "หน้าร้าน", "s": "React"}, {"id": "ls", "x": 20, "y": 178, "t": "localStorage", "a": "กระเป๋าลูกค้า", "s": "เก็บ token"}, {"id": "nginx", "x": 205, "y": 28, "t": "nginx", "a": "พนักงานต้อนรับ", "s": ".171 : 80"}, {"id": "flask", "x": 390, "y": 28, "t": "Flask", "a": "ห้องครัว", "s": ".169 : 5000"}, {"id": "ai", "x": 575, "y": 28, "t": "AI Server", "a": "เชฟพิเศษ (GPU)", "s": ".160 : 8088"}, {"id": "db", "x": 390, "y": 178, "t": "SQLite", "a": "สมุดบัญชี", "s": "database.db"}, {"id": "disk", "x": 575, "y": 178, "t": "uploads/", "a": "ตู้เก็บรูป", "s": "ไฟล์ .png"}], "edges": [["browser", "nginx"], ["nginx", "flask"], ["flask", "ai"], ["flask", "db"], ["flask", "disk"], ["browser", "ls"]]}, "steps": [{"t": "Browser = หน้าร้าน", "at": "browser", "say": "ส่วนที่ผู้ใช้เห็นและกด เขียนด้วย React ทุกหน้า (Login, Generate, History…) อยู่ในโค้ดชุดเดียว เปลี่ยนหน้าโดยไม่ต้องโหลดใหม่", "code": {"k": "app_routes", "hl": [22, 25, 28, 31, 38], "focus": [{"l": 22, "n": 1, "tr": "ถ้า URL คือ /login → แสดงหน้า Login"}, {"l": 25, "n": 1, "tr": "ทุกหน้าที่อยู่ข้างในนี้ ต้องล็อกอินก่อนถึงจะเข้าได้"}, {"l": 28, "n": 1, "tr": "/generate → หน้าสร้างภาพ"}, {"l": 31, "n": 1, "tr": "/history → หน้าประวัติ"}, {"l": 38, "n": 1, "tr": "URL อื่นที่ไม่รู้จัก → พากลับหน้าแรก"}]}, "more": "<p>ไฟล์ <code>App.jsx<\/code> เป็นสารบัญของเว็บ บอกว่า URL ไหนแสดง component ไหน ตอน build Vite รวมทุกหน้าเป็นไฟล์ JS ไม่กี่ไฟล์ใน <code>dist/<\/code> แล้ว nginx เป็นคนส่งไฟล์เหล่านี้ให้ browser<\/p>"}, {"t": "nginx = พนักงานต้อนรับ", "at": "nginx", "say": "ทุกคนเข้าร้านผ่านประตูนี้ประตูเดียว ถ้าขอ “หน้าเว็บ” nginx ส่งให้เองเลย ถ้าขอ “ข้อมูล” (URL ขึ้นต้น /api/v1/) จะเดินไปส่งให้ห้องครัว", "code": {"k": "nginx_loc", "hl": [104, 127, 133], "focus": [{"l": 104, "n": 1, "tr": "ขอหน้าเว็บทั่วไป → ส่งไฟล์จากโฟลเดอร์ dist"}, {"l": 127, "n": 1, "tr": "ขอข้อมูล /api/v1/... → ส่งต่อให้ Flask"}, {"l": 133, "n": 1, "tr": "/api/ แบบอื่น → ปฏิเสธเลย ไม่ให้ถึง Flask"}]}, "more": "<p>ผู้ใช้รู้จักแค่ IP ของเครื่อง nginx (<code>192.168.1.171<\/code>) ไม่รู้ว่า Flask หรือ AI อยู่ไหน nginx ยังช่วยจำกัดจำนวนครั้งที่ยิงได้ (rate limit) ใส่ header ความปลอดภัย และจำกัดขนาดไฟล์อัปโหลด<\/p>"}, {"t": "Flask = ห้องครัว", "at": "flask", "say": "ที่ที่ทำงานจริง: ตรวจว่าเป็นสมาชิกไหม คิดคำนวณ จดสมุด แล้วจัดของส่งกลับ แบ่งเมนูเป็นกลุ่ม ๆ เรียกว่า Blueprint", "code": {"k": "app_init", "hl": [108, 110, 111, 113, 115], "focus": [{"l": 108, "n": 1, "tr": "เมนูกลุ่มสมาชิก: /login, /register"}, {"l": 110, "n": 1, "tr": "เมนูกลุ่มสร้างภาพ AI: /generate, /images, /models"}, {"l": 111, "n": 1, "tr": "เมนูกลุ่มประวัติ: /history"}, {"l": 113, "n": 1, "tr": "เมนูกลุ่มแต่งภาพ: /process/..."}, {"l": 115, "n": 1, "tr": "เอาเมนูมาติดตั้ง โดยเติม /api/v1 ข้างหน้าทุกตัว"}]}, "more": "<p><code>create_app()<\/code> ใน <code>backend/app/__init__.py<\/code> ประกอบร้าน: โหลดค่าตั้ง ต่อฐานข้อมูล ติดตั้ง Blueprint ทุกกลุ่ม แล้วสร้างตารางถ้ายังไม่มี<\/p>"}, {"t": "AI Server = เชฟพิเศษที่มีเตาเดียว", "at": "ai", "say": "เครื่องที่มีการ์ดจอ รันโปรแกรม Stable Diffusion WebUI ทำได้ทีละภาพ ลูกค้าเดินเข้าไปสั่งเองไม่ได้ ต้องให้ห้องครัว (Flask) ไปสั่งแทน", "code": {"k": "config_ai", "hl": [50, 53], "focus": [{"l": 50, "n": 1, "tr": "ที่อยู่ของเครื่อง AI อ่านจากไฟล์ .env"}, {"l": 53, "n": 1, "tr": "รอ AI วาดภาพได้นานสุด 75 วินาที"}]}, "more": "<p>WebUI เปิดโหมด <code>--api<\/code> ให้เรียกผ่าน HTTP ได้ Flask ใช้แค่ 2 endpoint: <code>/sdapi/v1/sd-models<\/code> (ขอรายชื่อโมเดล) กับ <code>/sda  "short": "เปิดหน้า History", "intro": "ผู้ใช้กดเปิดหน้า History ดูว่าคำขอเดินผ่านใครบ้าง ตั้งแต่ออกจากเบราว์เซอร์จนข้อมูลกลับมาแสดง", "stage": {"h": 270, "nodes": [{"id": "browser", "x": 20, "y": 28, "t": "Browser", "a": "หน้าร้าน", "s": "React"}, {"id": "ls", "x": 20, "y": 178, "t": "localStorage", "a": "กระเป๋าลูกค้า", "s": "เก็บ token"}, {"id": "nginx", "x": 205, "y": 28, "t": "nginx", "a": "พนักงานต้อนรับ", "s": ".171 : 80"}, {"id": "flask", "x": 390, "y": 28, "t": "Flask", "a": "ห้องครัว", "s": ".169 : 5000"}, {"id": "ai", "x": 575, "y": 28, "t": "AI Server", "a": "เชฟพิเศษ (GPU)", "s": ".160 : 8088"}, {"id": "db", "x": 390, "y": 178, "t": "SQLite", "a": "สมุดบัญชี", "s": "database.db"}, {"id": "disk", "x": 575, "y": 178, "t": "uploads/", "a": "ตู้เก็บรูป", "s": "ไฟล์ .png"}], "edges": [["browser", "nginx"], ["nginx", "flask"], ["flask", "ai"], ["flask", "db"], ["flask", "disk"], ["browser", "ls"]]}, "steps": [{"t": "ขอหน้าเว็บ", "move": ["browser", "nginx"], "label": "GET /history", "say": "เบราว์เซอร์ขอหน้า /history จากพนักงานต้อนรับ", "box": {"ประเภท": "GET (ขอดู)", "URL": "/history"}, "code": {"k": "nginx_loc", "hl": [104, 105], "focus": [{"l": 104, "n": 1, "tr": "/history ไม่ได้ขึ้นต้นด้วย /api/ เลยเข้าห้องนี้"}, {"l": 105, "n": 1, "tr": "หาไฟล์ชื่อ history ไม่เจอ → ส่ง index.html ไปแทน"}]}, "more": "<p>ไม่มีไฟล์ชื่อ history จริง ๆ ทุกหน้าใช้ index.html ตัวเดียว แล้ว React เป็นคนดู URL เองว่าต้องแสดงหน้าไหน นี่คือเหตุผลที่กด refresh หน้าไหนก็ไม่ 404<\/p>"}, {"t": "ได้หน้าเว็บกลับมา", "move": ["nginx", "browser"], "label": "index.html + JS", "say": "เบราว์เซอร์ได้ไฟล์ React มา React อ่าน URL แล้ววาดหน้า History แต่ยังไม่มีข้อมูลรูป", "box": {"ได้กลับมา": "index.html, index-xxxx.js, index-xxxx.css"}, "code": {"k": "nginx_loc", "hl": [109, 110], "focus": [{"l": 109, "n": 1, "tr": "ไฟล์ JS/CSS อยู่ในโฟลเดอร์ assets"}, {"l": 110, "n": 1, "tr": "ให้เบราว์เซอร์จำไฟล์ไว้ได้ 1 ปี ไม่ต้องโหลดซ้ำ"}]}, "more": "<p>ชื่อไฟล์มีรหัส hash เช่น <code>index-a1b2.js<\/code> ครัวเอารหัสที่ผู้ใช้พิมพ์ไปบดด้วยวิธีเดียวกัน แล้วดูว่าได้ผลตรงกันไหม", "box": {"id": "7", "password_hash": "scrypt:32768:8:1$Xq3…$9fa2…"}, "code": {"k": "auth_py", "hl": [147, 151], "focus": [{"l": 147, "n": 1, "tr": "ไม่มีอีเมลนี้ หรือ บดแล้วไม่ตรง…"}, {"l": 151, "n": 1, "tr": "…ตอบข้อความเดียวกัน ไม่บอกว่าผิดตรงไหน"}]}, "more": "<p>hash ย้อนกลับเป็นรหัสจริงไม่ได้ ข้อมูลรั่วออกไปก็ไม่รู้รหัส ในค่ามี salt สุ่มต่อคน ทำให้รหัสเดียวกันได้ hash ต่างกัน ตอบข้อความเดียวกันทั้งสองกรณี คนนอกจึงเดาไม่ได้ว่าอีเมลไหนมีบัญชี<\/p>"}, {"t": "ทำบัตรสมาชิก (JWT)", "at": "flask", "say": "รหัสถูกต้อง ห้องครัวทำบัตรให้: เขียนว่าเป็นใคร หมดอายุเมื่อไร แล้วประทับตราด้วยกุญแจลับที่มีแค่เซิร์ฟเวอร์รู้", "vars": {"ข้อมูลในบัตร": "{ user_id: 7, email, role: 'user', exp: พรุ่งนี้เวลานี้ }", "บัตรที่ได้": "eyJhbGci.eyJ1c2Vy.SflKxwRJ"}, "code": {"k": "auth_py", "hl": [161, 162, 163, 164, 165, 166, 168], "focus": [{"l": 161, "n": 6, "tr": "ข้อมูลที่เขียนในบัตร…"}, {"l": 168, "n": 1, "tr": "ประทับตราด้วยกุญแจลับ ได้บัตรออกมา"}]}, "more": "<p>JWT มี 3 ท่อนคั่นด้วยจุด: header.payload.signature ใครก็อ่าน payload ได้ (ไม่ได้เข้ารหัส) แต่ถ้าแก้ เช่นเปลี่ยน role เป็น admin ตราประทับจะไม่ตรงทันที เพราะไม่มีกุญแจลับ<\/p>"}, {"t": "ส่งบัตรกลับ", "move": ["flask", "nginx", "browser"], "label": "200 { access_token }", "say": "ส่งบัตรกลับไปพร้อมข้อมูลสมาชิก (ไม่ส่ง hash ของรหัสผ่านไปด้วย)", "box": {"access_token": "eyJhbGci…", "expires_in": "86400 (วินาที = 24 ชม.)", "user": "{ id: 7, email, role: 'user' }"}, "code": {"k": "auth_py", "hl": [178, 181], "focus": [{"l": 178, "n": 1, "tr": "บัตร"}, {"l": 181, "n": 1, "tr": "ข้อมูลสมาชิก (to_dict ตัด password_hash ทิ้ง)"}]}, "more": "<p>อายุบัตรตั้งไว้ใน <code>config.py<\/code>: <code>JWT_EXPIRES_IN = timedelta(hours=24)<\/code><\/p>"}, {"t": "เก็บบัตรใส่กระเป๋า", "move": ["browser", "ls"], "label": "setItem('luma_token')", "say": "หน้าเว็บเก็บบัตรลง localStorage (ปิดเบราว์เซอร์แล้วยังอยู่) และบอก React ว่าตอนนี้ล็อกอินแล้ว", "box": {"luma_token": "eyJhbGci…", ": "มีไฟล์ไหม นามสกุลถูกไหม วงกลมเป็น [x, y, r] จริงไหม แล้วแปลงไฟล์เป็นตารางตัวเลข (array) ที่ OpenCV ใช้ได้", "vars": {"img.shape": "(1000, 1600, 3) = สูง × กว้าง × 3 สี", "ชนิด": "uint8 (0-255)"}, "code": {"k": "routes_spot", "hl": [37, 48, 75, 76], "focus": [{"l": 37, "n": 1, "tr": "หยิบไฟล์รูปจากกล่อง"}, {"l": 48, "n": 1, "tr": "แปลงข้อความกลับเป็นรายการ"}, {"l": 75, "n": 1, "tr": "ไฟล์ → array ขนาด สูง×กว้าง×3"}, {"l": 76, "n": 1, "tr": "แปลงไม่ได้ = ไม่ใช่รูปจริง → 400"}]}, "more": "<p>รูปในคอมพิวเตอร์คือตารางตัวเลข แต่ละช่อง (พิกเซล) มี 3 ค่าคือ น้ำเงิน เขียว แดง (OpenCV เรียงเป็น BGR) ค่าละ 0-255<\/p>"}, {"t": "สูตรขั้น 1: เบลอทั้งรูปเตรียมไว้", "move": ["flask", "cv"], "label": "spot_blur()", "viz": "sb_blurall", "say": "เบลอทั้งรูปเก็บไว้ก่อน ยังไม่ใช้ แต่ละพิกเซลกลายเป็นค่าเฉลี่ยของพิกเซลรอบ ๆ (ใกล้มากนับมาก ไกลนับน้อย)", "vars": {"strength": "15", "ขนาดหน้าต่าง k": "15 × 2 + 1 = 31"}, "code": {"k": "spot_py", "hl": [15, 16], "focus": [{"l": 15, "n": 1, "tr": "ขนาดหน้าต่างต้องเป็นเลขคี่ จะได้มีจุดกลาง"}, {"l": 16, "n": 1, "tr": "เบลอแบบ Gaussian"}]}, "more": "<p>Gaussian ให้น้ำหนักเป็นรูประฆังคว่ำ จุดกลางสำคัญสุด ไกลออกไปสำคัญน้อยลง ผลจึงเบลอเนียนกว่าเฉลี่ยธรรมดา<\/p>"}, {"t": "สูตรขั้น 2: ทำแผนที่ว่าเบลอตรงไหน", "at": "cv", "viz": "sb_mask", "say": "สร้างรูปขาวดำขนาดเท่ารูปจริง ขาว (1) = ตรงที่จะเบลอ ดำ (0) = ตรงที่ไม่แตะ เรียกว่า mask", "code": {"k": "spot_py", "hl": [19, 21], "focus": [{"l": 19, "n": 1, "tr": "เริ่มจากแผ่นดำทั้งแผ่น"}, {"l": 21, "n": 1, "tr": "วาดวงกลมสีขาวทึบตามที่ผู้ใช้ระบาย"}]}, "more": ""}, {"t": "สูตรขั้น 3: ทำขอบให้นุ่ม", "at": "cv", "viz": "sb_softmask", "say": "ถ้าใช้ขอบคม จะเห็นเส้นแบ่งชัดระหว่างส่วนเบลอกับส่วนคม จึงเบลอตัว mask ด้วย ขอบจะค่อย ๆ จางจาก 1 ไป 0", "code": {"k": "spot_py", "hl": [26], "focus": [{"l": 26, "n": 1, "tr": "เบลอ mask"}]}, "more": ""}, {"t": "สูตรขั้น 4: ผสมสองรูป", "at": "cv", "viz": "sb_result", "say": "ทุกพิกเซล: ถ้า mask = 1 ใช้รูปเบลอ ถ้า 0 ใช้รูปเดิม ถ้า 0.5 ผสมอย่างละครึ่ง", "vars": {"ตัวอย่าง m function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* ---------- syntax colouring ---------- */
const KW = {
  py: 'def|return|if|elif|else|for|in|not|and|or|is|None|True|False|try|except|finally|with|as|import|from|raise|global|lambda|while|class|pass',
  js: 'function|return|if|else|const|let|var|await|async|try|catch|finally|new|throw|export|default|import|from|for|of|typeof|instanceof|null|undefined|true|false',
  sql: 'CREATE|TABLE|IF|NOT|EXISTS|INTEGER|PRIMARY|KEY|AUTOINCREMENT|VARCHAR|NULL|UNIQUE|DEFAULT|TEXT|DATETIME|FLOAT|BIGINT|BLOB|FOREIGN|REFERENCES|ON|DELETE|CASCADE|INDEX|PRAGMA|CURRENT_TIMESTAMP',
  nginx: 'location|server|listen|proxy_pass|proxy_set_header|proxy_http_version|include|try_files|add_header|limit_req|return|deny|allow|root|index|proxy_read_timeout|proxy_send_timeout|proxy_connect_timeout|access_log|log_not_found|client_max_body_size|error_page',
};
function colour(line, lang, st){
  if (lang === 'py' && (st.doc || line.includes('"""'))) {
    const n = (line.match(/"""/g) || []).length;
    if (n % 2 === 1) st.doc = !st.doc;
    return '<span class="st">' + esc(line) + '</span>';
  }
  const com = lang === 'js' ? '\\/\\/.*$|\\/\\*.*?\\*\\/' : lang === 'sql' ? '--.*$' : '#.*$';
  const re = new RegExp('(' + com + ')|("(?:\\\\.|[^"\\\\])*"|\'(?:\\\\.|[^\'\\\\])*\'|`(?:\\\\.|[^`\\\\])*`)|\\b(' + KW[lang] + ')\\b|\\b(\\d+(?:\\.\\d+)?)\\b', 'g');
  let out = '', last = 0, m;
  while ((m = re.exec(line))) {
    out += esc(line.slice(last, m.index));
    const cls = m[1] ? 'cm' : m[2] ? 'st' : m[3] ? 'kw' : 'nu';
    out += '<span class="' + cls + '">' + esc(m[0]) + '</span>';
    last = re.lastIndex;
    if (m[0] === '') re.lastIndex++;
  }
  return out + esc(line.slice(last));
}

}
function legend(items){ return items.map(([c, t]) => `<span class="sw"><i style="background:rgb(${c.join(',')})"></i>${t}</span>`).join(''); }
function overlayText(t){ ctx.font = '600 10px "JetBrains Mono", monospace'; const w = ctx.measureText(t).width + 10;
  ctx.fillStyle = 'rgba(15,20,27,.78)'; ctx.fillRect(6, VH - 22, w, 16); ctx.fillStyle = '#fff'; ctx.fillText(t, 11, VH - 10); }

function drawViz(key){
  let cap = '';
  if (key.startsWith('sb_')) {
    const sc = scene();
    if (key === 'sb_orig') { put(sc); cap = 'ภาพหลัง <code>imdecode</code>: array ขนาด H×W×3'; }
    if (key === 'sb_paint') { put(sc); ctx.fillStyle = 'rgba(13,148,136,.5)';
      CIRCLES.forEach(([x, y, r]) => { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); });
      overlayText('บนจอ 400 px  ×4  →  รูปจริง 1600 px'); cap = 'วงสีเขียวคือวงกลมที่ผู้ใช้ระบายทับใบหน้า (overlay บน canvas)'; }
    if (key === 'sb_blurall') { const b = cache.sbb || (cache.sbb = sc.map(c => gauss(c, 4))); put(b); cap = 'Gaussian blur ทั้งภาพ (ยังไม่ได้ใช้ ต้องรอ mask)'; }
    if (key === 'sb_mask') { const m = sbMask(false); put(null, i => [m[i]*255, m[i]*255, m[i]*255]); cap = 'mask: ขาว = 1 (เบลอ) · ดำ = 0 (คงเดิม)'; }
    if (key === 'sb_softmask') { const m = cache.sbs || (cache.sbs = sbMask(true)); put(null, i => [m[i]*255, m[i]*255, m[i]*255]); cap = 'mask หลังเบลอขอบ: ค่าระหว่าง 0-1 ที่ขอบ'; }
    if (key === 'sb_result') { const b = cache.sbb || (cache.sbb = sc.map(c => gauss(c, 4))), m = cache.sbs || (cache.sbs = sbMask(true));
      put(null, i => [sc[0][i]*(1-m[i]) + b[0][i]*m[i], sc[1][i]*(1-m[i]) + b[1][i]*m[i], sc[2][i]*(1-m[i]) + b[2][i]*m[i]]);
      cap = 'out = img·(1−mask) + blurred·mask → เบลอเฉพาะใบหน้า'; }
  }
  if (key.startsWith('ct_')) {
    const sc = scene();
    if (key === 'ct_orig') { put(sc); cap = 'ภาพต้นฉบับ (มี noise เหมือนภาพถ่ายจริง)'; }
    else {
      const ct = cartoon();
      if (key === 'ct_bilateral') { put(ct.col); cap = 'หลัง bilateral 2 รอบ: noise หาย ผิวเรียบ แต่ขอบหน้าต่าง ใบหน้า ป้าย ยังคม'; }
      if (key === 'ct_kmeans') { put(null, i => [...ct.cen[ct.lab[i]]]); cap = 'เหลือ 8 สี: ' + ct.cen.map(c => `<span class="sw"><i style="background:rgb(${c.map(Math.round).join(',')})"></i></span>`).join(''); }
      if (key === 'ct_edges') { put(null, i => [ct.edge[i], ct.edge[i], ct.edge[i]]); cap = 'adaptive threshold (block 9, C 2): เส้นดำบนพื้นขาว'; }
      if (key === 'ct_erode') { put(null, i => [ct.ero[i], ct.ero[i], ct.ero[i]]); cap = 'หลัง erode kernel 2×2: เส้นหนาขึ้น'; }
      if (key === 'ct_final') { put(null, i => ct.ero[i] ? [...ct.cen[ct.lab[i]]] : [0, 0, 0]); cap = 'bitwise_and(สี 8 สี, เส้น) = ภาพการ์ตูน'; }
    }
  }
  if (key.startsWith('rb_')) {
    if (key === 'rb_orig') { rbRender(rbPhoto); cap = 'ภาพหลังย่อ (ภาพจำลอง: คนใส่หมวกยืนในสนาม มีพุ่มไม้มุมซ้าย)'; }
    if (key === 'rb_input') { rbRender((s, x, y) => { let c = rbPhoto(s); if (inStroke(x, y)) c = mix(c, [34, 197, 94], .6); return c; });
      ctx.setLineDash([5, 4]); ctx.strokeStyle = '#fde047'; ctx.lineWidth = 2; ctx.strokeRect(...RECT); ctx.setLineDash([]);
      cap = legend([[[253, 224, 71], 'กรอบ rect'], [[34, 197, 94], 'แปรง keep']]); }
    if (key === 'rb_prob') { rbRender(s => heat(s.p)); cap = legend([[heat(0), '0 = พื้นหลัง'], [heat(.5), '0.5'], [heat(1), '1 = คน']]) + ' หมวกค่าต่ำ (AI พลาด) · พุ่มไม้ค่าสูง (ทายผิด)'; }
    if (key === 'rb_ai_only') { rbRender((s, x, y) => { const a = s.bush < s.person ? 0 : Math.min(1, Math.max(0, (s.p - .3) / .4)); return mix(checker(x, y), s.F, a); });
      cap = 'largest blob ทิ้งพุ่มไม้ได้ แต่หมวกหายไปด้วย'; }
    if (key === 'rb_trimap' || key === 'rb_strokes') { const k = key === 'rb_strokes'; rbRender((s, x, y) => triAt(s, x, y, k));
      cap = legend([[TRI.BGD, 'BGD'], [TRI.PR_BGD, 'PR_BGD'], [TRI.PR_FGD, 'PR_FGD'], [TRI.FGD, 'FGD']]) + (k ? ' แปรง keep ทำให้หมวกเป็น FGD' : ''); }
    if (key === 'rb_grabcut') { rbRender(s => { const v = cov(s.obj, 1) * 255; return [v, v, v]; }); cap = 'ผล GrabCut + largest blob: ได้ทั้งคนและหมวก ไม่มีพุ่มไม้'; }
    if (key === 'rb_halo') { const V = [118, 30, 84, 52.5], dark = [32, 36, 44];
      rbRender((s, x, y, px) => { const a = cov(s.obj, 4), I = mix(s.bg, s.F, a);
        if (px === VW/2) return [255, 255, 255];
        return px < VW/2 ? mix(dark, I, a) : mix(dark, s.F, a); }, V);
      ctx.font = '600 11px "IBM Plex Sans Thai", sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText('ใช้สีเดิม I (ขอบเขียว)', 8, 16); ctx.fillText('แก้สมการหา F', VW/2 + 8, 16);
      cap = 'ซูมที่ขอบหัวไหล่ วางบนพื้นมืด: ซ้ายเห็นขอบสีสนามติดมา ขวาสะอาด'; }
    if (key === 'rb_final') { rbRender((s, x, y) => mix(checker(x, y), s.F, cov(s.obj, 1.4))); cap = 'PNG 4 ช่อง (BGRA): ลายตารางคือส่วนโปร่งใส'; }
  }
  $('vizCap').innerHTML = cap;
}



(function init(){
  const m = (location.hash || '').slice(1).match(/^(l\d)(?:-(\d+))?$/);
  let l = 0, s = 0;
  if (m) { const k = LESSONS.findIndex(L => L.id === m[1]); if (k >= 0) { l = k; s = Math.max(0, Math.min(LESSONS[k].steps.length, +(m[2] || 1)) - 1); } }
  go(l, s);
})();
