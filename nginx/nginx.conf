# =============================================================================
# nginx config สำหรับ Image_Project (Luma)
#
# หน้าที่ของ nginx ในระบบนี้
#   1. เสิร์ฟไฟล์ frontend ที่ build แล้ว (React + Vite -> โฟลเดอร์ dist/)
#   2. reverse proxy ทุก request ที่ขึ้นต้นด้วย /api/ ไปหา Flask backend (port 5000)
#
#   Browser ──> nginx :80 ──┬── /        -> static files ใน dist/
#                           └── /api/... -> http://127.0.0.1:5000/api/...
#
# วิธีใช้ (Linux)
#   sudo cp nginx/nginx.conf /etc/nginx/conf.d/luma.conf     # หรือ sites-available + symlink
#   sudo nginx -t && sudo systemctl reload nginx
#
# สิ่งที่ต้องแก้ตามเครื่องจริง: ค่าใน [1] และ [2] ด้านล่างเท่านั้น
#
# หมายเหตุฝั่ง frontend: ตอน build ให้ตั้ง VITE_API_BASE_URL=/api/v1 (path แบบ relative)
# เพื่อให้ browser ยิง API ผ่าน nginx ตัวนี้ (origin เดียวกัน ไม่ติด CORS)
# =============================================================================


# [1] Flask backend — แก้ host:port ตรงนี้ที่เดียวถ้า backend อยู่คนละเครื่อง
upstream luma_backend {
    server 127.0.0.1:5000;
    keepalive 16;
}


server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # รับทุก hostname/IP ที่ชี้มาที่เครื่องนี้ (ไม่ต้อง hardcode IP ในวง LAN)
    server_name _;

    # [2] path ของ frontend ที่ build แล้ว (ผลลัพธ์ของ `npm run build` ใน frontend/luma-frontend)
    root /var/www/luma/dist;
    index index.html;

    # ขนาด body สูงสุด (เผื่ออนาคตมี upload รูป/reference image)
    client_max_body_size 100M;

    # log แยกของโปรเจกต์ (ลบ 2 บรรทัดนี้ได้ถ้าจะใช้ log รวมของ nginx)
    access_log /var/log/nginx/luma.access.log;
    error_log  /var/log/nginx/luma.error.log warn;

    # ---- บีบอัด response ข้อความ (JS/CSS/JSON) ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        image/svg+xml;

    # หมายเหตุ: nginx จะ "ไม่สืบทอด" add_header จาก server block ถ้า location นั้นมี
    # add_header ของตัวเอง -> security headers จึงต้องใส่ซ้ำในแต่ละ location ที่ตั้ง Cache-Control

    # =========================================================================
    # 1) API -> Flask
    #    ทุก path ใต้ /api/ (รวม /api/v1/generate, /api/v1/images/<id>, /api/v1/history)
    #    ส่งต่อไปที่ backend ด้วย path เดิม
    # =========================================================================
    location /api/ {
        proxy_pass http://luma_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # การ generate รูปผ่าน Stable Diffusion ใช้เวลานาน -> timeout ต้องยาวกว่า
        # ค่า timeout ที่ backend ใช้เรียก AI Server (ตอนนี้ ~75s) เผื่อไว้ 10 นาที
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # รูปที่ตอบกลับจาก /api/v1/images/<id> อาจใหญ่ -> เพิ่ม buffer กันไป temp file
        proxy_buffers         16 64k;
        proxy_buffer_size     64k;
        proxy_busy_buffers_size 128k;

        # API response ไม่ควรถูก cache ที่ browser
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # =========================================================================
    # 2) ไฟล์ static ที่ Vite build ออกมาใน dist/assets/ มี hash ในชื่อไฟล์อยู่แล้ว
    #    (เช่น index-a1b2c3.js) -> cache ได้นานเต็มที่ เปลี่ยนเวอร์ชันชื่อไฟล์ก็เปลี่ยนเอง
    # =========================================================================
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # favicon / รูปใน public/ ที่ไม่มี hash -> cache สั้นๆ พอ
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        access_log off;
        try_files $uri =404;
    }

    # =========================================================================
    # 3) SPA fallback: React Router จัดการ path ฝั่ง client (/login, /history, /generate ...)
    #    ถ้าไม่มีไฟล์ตรงกับ path ให้ส่ง index.html กลับไปเสมอ
    #    index.html ห้าม cache ไม่งั้น deploy ใหม่แล้ว browser ยังเห็น bundle เก่า
    # =========================================================================
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # =========================================================================
    # 4) health check ของ nginx เอง (ใช้เช็คว่า nginx ขึ้นแล้วโดยไม่แตะ backend)
    # =========================================================================
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # กันไฟล์ซ่อน เช่น .env .git ถ้าเผลอวางไว้ใน root
    location ~ /\. {
        deny all;
    }
}
