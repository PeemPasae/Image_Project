# =====================================================================
#  LUMA — nginx reverse proxy (วางบนเครื่อง Backend 172.20.56.158)
#  โหมดหลัก: LAN — เปิดเดโมนอกวงชั่วคราวผ่าน Cloudflare quick tunnel ได้ (ดู DEMO-cloudflared.md)
#
#  รวมของดีจาก 2 เวอร์ชัน:
#    - โครงกันคนนอก: ประตูเดียว, เสิร์ฟ dist, จำกัด /api/v1/, rate limit, DEV gateway
#    - ของทีม: gzip, security headers ครบ, tcp_nodelay, autoindex off
#
#  หลักการ: nginx เป็น "ประตูเดียว" ของระบบ
#    - ผู้ใช้ทั่วไปในวง LAN  → เข้าได้แค่พอร์ต 80  (หน้าเว็บ + /api/v1/ 9 endpoint)
#    - ทีม DEV เท่านั้น      → พอร์ต 8089 (SD WebUI / API ดิบของ AI Server)
#    - Flask :5000, Vite :5173, SD :8088 → ห้ามเข้าตรง (bind localhost + firewall)
#
#  ไฟล์นี้เป็น nginx.conf ทั้งไฟล์ (มี events / http ครบ)
#    Windows : วางทับ  <nginx>\conf\nginx.conf   และ dev_allowlist.conf ไว้โฟลเดอร์เดียวกัน
#    Linux   : วางทับ  /etc/nginx/nginx.conf     และ dev_allowlist.conf ไว้ /etc/nginx/
#  เช็คก่อนใช้เสมอ:  nginx -t   แล้วค่อย  nginx -s reload
# =====================================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ---- ประสิทธิภาพเครือข่าย ------------------------------------------
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout  65;

    # ไม่โชว์เวอร์ชัน nginx ใน header / หน้า error, ปิด directory listing
    server_tokens off;
    autoindex     off;

    # ---- Gzip: ลด bandwidth หน้าเว็บโหลดเร็วขึ้น (ดึงมาจาก config ของทีม) -----
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/xml+rss image/svg+xml;

    # ---- Log: เห็น IP จริงของคนที่ยิงเข้ามา (ไล่ดูว่าใครพยายามเข้าหลังบ้าน) ----
    log_format  luma  '$remote_addr - [$time_local] "$request" '
                      '$status $body_bytes_sent $request_time "$http_user_agent"';
    access_log  logs/luma.access.log  luma;
    error_log   logs/luma.error.log   warn;

    # ---- Real client IP ผ่าน Cloudflare Tunnel (เดโมเท่านั้น) -----------------
    #  cloudflared ต่อจาก 127.0.0.1 → เชื่อ header CF-Connecting-IP เฉพาะจาก localhost
    #  ผลดี: rate limit นับแยก "รายคนจริง" (ไม่งั้นทุกคนที่มาทาง tunnel = 127.0.0.1 คนเดียว โดน 429 พร้อมกัน)
    #        + allowlist / _dev ยังเห็น IP จริง → คนนอกโดน 403 เหมือนเดิม, log เห็น IP จริง
    #  LAN ปกติไม่กระทบ: คน LAN ไม่ได้มาจาก 127.0.0.1 → header ถูกเมิน (กัน spoof)
    set_real_ip_from  127.0.0.1;
    real_ip_header    CF-Connecting-IP;
    real_ip_recursive on;

    # ---- Rate limit: กัน brute-force รหัสผ่าน / ยิง API รัว ๆ -----------------
    limit_req_zone  $binary_remote_addr  zone=luma_auth:10m  rate=10r/m;   # login / register
    limit_req_zone  $binary_remote_addr  zone=luma_api:10m   rate=120r/m;  # API ทั่วไป
    limit_req_status 429;

    # ---- Upstreams -----------------------------------------------------
    upstream luma_backend {
        server 127.0.0.1:5000;          # Flask ต้อง bind 127.0.0.1 (ดู backend/run.py)
        keepalive 16;
    }

    upstream luma_ai_server {
        server 127.0.0.1:8088;          # SD WebUI — รันเครื่องเดียวกับ nginx (ถ้าย้ายเครื่อง แก้ที่นี่ + backend/.env AI_SERVER_URL)
    }

    # =====================================================================
    #  1) พอร์ต 80 — ประตูสาธารณะ (ทุกคนในวง LAN)
    # =====================================================================
    server {
        listen       80 default_server;
        server_name  _;

        # API รับแค่ JSON เล็ก ๆ (V1 ไม่มี upload) — กันคนยัด body ยักษ์ใส่ Flask
        client_max_body_size  2m;

        # ---- Security headers (รวมของทีม: เพิ่ม XSS-Protection) ----
        add_header X-Content-Type-Options  "nosniff"          always;
        add_header X-Frame-Options         "SAMEORIGIN"       always;
        add_header X-XSS-Protection        "1; mode=block"    always;
        add_header Referrer-Policy         "same-origin"      always;
        add_header Cache-Control           "no-store"         always;

        # ---- Frontend (React build) --------------------------------------
        # รัน `npm run build` แล้วชี้ root มาที่โฟลเดอร์ dist (Windows ใส่ quote เพราะ path มีช่องว่าง)
        # Linux: root /var/www/luma/dist;
        root   "C:/Learn Uni/Y3/Term1/Image processing/ProjectFinal/Image_Project/frontend/luma-frontend/dist";
        index  index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ไฟล์ static ที่ vite ใส่ hash ในชื่อแล้ว → cache ได้ยาว
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # ---- ปิดทางเข้าไฟล์หลังบ้านผ่าน static root (กันคนเผลอเอา root ชี้ผิด) ----
        location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }   # .env .git ฯลฯ
        location ~* \.(env|db|sqlite3?|bak|py|pyc|log|sql|ini|sh|bat|cmd|config)$ {
            deny all; access_log off; log_not_found off;
        }

        # ---- Backend API: อนุญาตเฉพาะ /api/v1/ (9 endpoint ตาม spec) --------
        # login / register: จำกัดถี่กว่าตัวอื่น กัน brute-force
        location ~ ^/api/v1/(login|register)$ {
            limit_req  zone=luma_auth  burst=5  nodelay;
            include    luma_proxy_backend.conf;
        }

        location /api/v1/ {
            limit_req  zone=luma_api  burst=40  nodelay;
            include    luma_proxy_backend.conf;
        }

        # path อื่น ๆ ใต้ /api/ ที่ไม่ใช่ v1 → ไม่ต้องให้ Flask เห็นเลย
        location /api/ { return 404; }

        # ---- health check ให้ทีม (ไม่แตะ Flask) -------------------------------
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # ---- DEV only: ping Flask ตรง ๆ ผ่าน nginx (ไม่ต้องเปิดพอร์ต 5000) -------
        location /_dev/backend/ {
            include    dev_allowlist.conf;
            auth_basic           "LUMA DEV";
            auth_basic_user_file luma_dev.htpasswd;
            proxy_pass http://luma_backend/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # หน้า error ให้เป็น JSON envelope เดียวกับ backend เวลา Flask ล่ม
        error_page 502 503 504 = @backend_down;
        location @backend_down {
            default_type application/json;
            return 503 '{"success":false,"error":{"code":"INTERNAL_SERVER_ERROR","message":"Backend is unavailable"}}';
        }
    }

    # =====================================================================
    #  2) พอร์ต 8089 — ประตูหลังบ้านสำหรับทีม DEV เท่านั้น
    #     → SD WebUI (Gradio) + /sdapi/v1/* ของ AI Server
    #     คนนอก allowlist ได้ 403 ทันที, คนใน allowlist ต้องใส่รหัส basic auth อีกชั้น
    #     (SD WebUI :8088 ต้องถูก firewall ปิดจาก LAN → ทางเดียวที่ DEV เข้าได้คือพอร์ตนี้)
    # =====================================================================
    server {
        listen       8089;
        server_name  _;

        include              dev_allowlist.conf;
        auth_basic           "LUMA DEV — AI Server";
        auth_basic_user_file luma_dev.htpasswd;

        # กัน extension ที่ติดตั้งผ่าน WebUI (--enable-insecure-extension-access) ขนาดใหญ่
        client_max_body_size 200m;

        # Gradio ใช้ websocket + SSE queue → ต้องปิด buffering และเปิด upgrade
        location / {
            proxy_pass http://luma_ai_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_buffering    off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
