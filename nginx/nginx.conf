# =====================================================================
#  LUMA — NGINX Pure Reverse Proxy
#
#  เครื่องนี้ทำหน้าที่เป็น Reverse Proxy ทางเข้าเดียว (Port 80)
#    - Frontend Server : 172.20.57.76:5173 (Vite)
#    - Backend Server  : 172.20.56.248:5000 (Flask API)
#    - Cloudflare Tunnel: ชี้มาที่ http://localhost:80
#
#  คนนอกเข้าผ่าน Cloudflare จะเข้าได้เฉพาะหน้าเว็บ และ /api/v1/ เท่านั้น
# =====================================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ---- ประสิทธิภาพเครือข่าย ------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # ปิดไม่ให้แสดงเวอร์ชัน NGINX
    server_tokens   off;

    # ---- Gzip Compression ----------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/xml+rss image/svg+xml;

    # ---- Logging (แสดง GET / POST, ปลายทางที่ส่งไป, และ Status ชัดเจน) ----
    log_format  luma  '[$time_local] IP: $remote_addr | $request | Status: $status | Forward to: $upstream_addr ($upstream_status, ${request_time}s)';
    access_log  logs/luma.access.log  luma;
    error_log   logs/luma.error.log   warn;

    # ---- Real Client IP ผ่าน Cloudflare Tunnel --------------------------
    #  cloudflared ต่อเข้า localhost:80 -> ดึง IP จริงจาก CF-Connecting-IP
    #  ทำให้ rate limit นับแยกตามคนจริง และ log เห็น IP แท้จริง
    set_real_ip_from  127.0.0.1;
    real_ip_header    CF-Connecting-IP;
    real_ip_recursive on;

    # ---- Rate Limit: ป้องกันคนนอกยิงรัว / brute-force -----------------
    limit_req_zone  $binary_remote_addr  zone=luma_auth:10m  rate=10r/m;   # login / register
    limit_req_zone  $binary_remote_addr  zone=luma_api:10m   rate=120r/m;  # API ทั่วไป
    limit_req_status 429;

    # ---- Upstream Servers ----------------------------------------------
    upstream luma_frontend {
        server 172.20.57.76:5173;       # เครื่อง Frontend (Vite)
        keepalive 16;
    }

    upstream luma_backend {
        server 172.20.56.248:5000;      # เครื่อง Backend (Flask)
        keepalive 16;
    }

    # =====================================================================
    #  พอร์ต 80 — ประตูทางเข้าเดียวของระบบ (ทั้งคนใน LAN และคนนอกผ่าน Cloudflare)
    # =====================================================================
    server {
        listen       80 default_server;
        server_name  _;

        # จำกัดขนาด Body (กันคนส่งขยะขนาดใหญ่)
        client_max_body_size  10m;

        # ---- Security Headers ------------------------------------------
        add_header X-Content-Type-Options  "nosniff"       always;
        add_header X-Frame-Options         "SAMEORIGIN"    always;
        add_header X-XSS-Protection        "1; mode=block" always;
        add_header Referrer-Policy         "same-origin"   always;

        # ---- บล็อกไฟล์อันตราย / sensitive -------------------------------
        location ~* \.(env|git|db|sqlite3?|bak|py|pyc|log|sql|ini|sh|bat|cmd|config)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ---- Health Check (ตรวจสอบสถานะ NGINX) --------------------------
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # ---- Backend API: อนุญาตเฉพาะ /api/v1/ --------------------------
        # 1) Login & Register (จำกัดความถี่เข้มงวด)
        location ~ ^/api/v1/(login|register)$ {
            limit_req  zone=luma_auth  burst=5  nodelay;
            
            proxy_pass         http://luma_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    120s;
            proxy_send_timeout    120s;
            proxy_intercept_errors on;
        }

        # 2) API v1 ทั่วไป
        location /api/v1/ {
            limit_req  zone=luma_api  burst=40  nodelay;
            
            proxy_pass         http://luma_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    120s;
            proxy_send_timeout    120s;
            proxy_intercept_errors on;
        }

        # 3) ปิดกั้น API path อื่น ๆ ที่ไม่ใช่ v1
        location /api/ {
            return 404;
        }

        # ---- Frontend: ส่งต่อไปที่ Vite Dev Server (172.20.57.76:5173) ---
        location / {
            proxy_pass         http://luma_frontend;
            proxy_http_version 1.1;

            # รองรับ WebSocket สำหรับ Vite Hot Module Replacement (HMR)
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout    120s;
            proxy_send_timeout    120s;
        }

        # หน้าตอบกลับกรณี Backend หรือ Frontend ไม่ตอบสนอง
        error_page 502 503 504 = @service_down;
        location @service_down {
            default_type application/json;
            return 503 '{"success":false,"error":{"code":"SERVICE_UNAVAILABLE","message":"Backend or Frontend service is unreachable"}}';
        }
    }
}
