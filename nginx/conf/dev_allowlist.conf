# =====================================================================
#  dev_allowlist.conf — รายชื่อ IP ของทีม DEV ที่เข้า "หลังบ้าน" ได้
#
#  ถูก include ใน nginx.conf ทุก location ที่เป็น DEV-only
#  (พอร์ต 8089 → SD WebUI / API ดิบของ AI Server, และ /_dev/ บนพอร์ต 80)
#
#  ⚠ IP ในวง LAN มหาลัยเป็น DHCP — เปลี่ยนเครื่อง/เปลี่ยนวันแล้ว IP อาจเปลี่ยน
#    ถ้าใครเข้าไม่ได้ (403) ให้เช็ค `ipconfig` แล้วมาแก้ไฟล์นี้ + ดับเบิลคลิก START.bat
#    ไฟล์นี้จึงเป็นด่านแรกเท่านั้น ด่านที่สองคือรหัสผ่าน (extras/make_htpasswd.sh)
# =====================================================================

allow 127.0.0.1;        # เครื่อง nginx เอง (เปิดผ่าน localhost)
allow 192.168.1.171;    # เครื่อง nginx เอง (เปิดผ่าน IP ในวง LAN)

# เติม IP เพื่อนในทีมที่ต้องเปิดหน้าหลังบ้าน (:8089 / /_dev/) แล้วดับเบิลคลิก START.bat ใหม่
# allow 192.168.1.169;  # Backend
# allow 192.168.1.160;  # AI Server

# ทุกคนที่ไม่อยู่ในรายชื่อด้านบน
deny all;
