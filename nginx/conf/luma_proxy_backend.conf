# =====================================================================
#  luma_proxy_backend.conf — ชุด proxy ไป Flask ที่ใช้ซ้ำทุก location /api/v1/*
#  (include จาก nginx.conf — ไม่ต้องแก้ไฟล์นี้ตอนเปลี่ยน IP, ไปแก้ upstream แทน)
# =====================================================================

proxy_pass         http://luma_backend;
proxy_http_version 1.1;
proxy_set_header   Connection        "";
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;

# Backend → AI Server รอได้ 75s, Frontend รอ 90s → nginx ต้องรอนานกว่านั้น
proxy_connect_timeout 5s;
proxy_read_timeout    120s;
proxy_send_timeout    120s;

# ไม่ใช้ proxy_intercept_errors: ให้ error JSON ของ Flask (เช่น AI_SERVER_ERROR 503) ส่งถึง frontend ตรง ๆ
# ถ้า nginx ต่อ Flask ไม่ได้เลย (502/504) error_page @backend_down ใน nginx.conf ยังทำงานเหมือนเดิม
