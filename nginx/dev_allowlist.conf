# =====================================================================
#  dev_allowlist.conf — รายชื่อ IP ของทีม DEV ที่เข้า "หลังบ้าน" ได้
#
#  ถูก include ใน nginx.conf ทุก location ที่เป็น DEV-only
#  (พอร์ต 8089 → SD WebUI / API ดิบของ AI Server, และ /_dev/ บนพอร์ต 80)
#
#  ⚠ IP ในวง LAN มหาลัยเป็น DHCP — เปลี่ยนเครื่อง/เปลี่ยนวันแล้ว IP อาจเปลี่ยน
#    ถ้าใครเข้าไม่ได้ (403) ให้เช็ค `ipconfig` แล้วมาแก้ไฟล์นี้ + `nginx -s reload`
#    ไฟล์นี้จึงเป็นด่านแรกเท่านั้น ด่านที่สองคือ basic auth (ดู README)
# =====================================================================

allow 127.0.0.1;        # ตัว nginx เอง (backend machine)

allow 172.20.56.158;    # กร   — Frontend + เครื่องที่รัน nginx/backend
# allow 172.20.xx.xx;   # ไอซ์ — AI Server (เติม IP)
# allow 172.20.xx.xx;   # นาย  — Backend (เติม IP)
# allow 172.20.xx.xx;   # ภีม  — Database (เติม IP)

# ทุกคนที่ไม่อยู่ในรายชื่อด้านบน
deny all;
