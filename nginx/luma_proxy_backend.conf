# =====================================================================
#  luma_proxy_backend.conf — ชุด proxy ไป Flask ที่ใช้ซ้ำทุก location /api/v1/*
#  (include จาก nginx.conf — ไม่ต้องแก้ไฟล์นี้ตอนเปลี่ยน IP, ไปแก้ upstream แทน)
# =====================================================================

proxy_pass         http://luma_backend;
proxy_http_version 1.1;
proxy_set_header   Connection        "";
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;

# Backend → AI Server รอได้ 75s, Frontend รอ 90s → nginx ต้องรอนานกว่านั้น
proxy_connect_timeout 5s;
proxy_read_timeout    120s;
proxy_send_timeout    120s;

# ถ้า Flask ล่ม/ตอบไม่ได้ → ให้ error_page @backend_down จัดการ (JSON envelope)
proxy_intercept_errors on;
